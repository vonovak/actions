---
name: Expo GitHub Action - Build Expo App
author: Expo
description: Setup Expo app, run prebuild, export, and optionally build native apps for compatibility testing
branding:
  icon: smartphone
  color: gray-dark
runs:
  using: composite
  steps:
    - name: Plan build steps
      id: build-plan
      env:
        EXPO_VERSION: ${{ inputs.expo-version }}
        BUILD: ${{ inputs.build }}
      run: |
        if [ -z "$EXPO_VERSION" ]; then
          echo "::error::expo-version input is required"
          exit 1
        fi

        # `auto` picks the native platform this runner can actually build, so the
        # default works everywhere and callers do not have to repeat the same
        # `runner.os == 'macOS' && ... || ...` ternary in every workflow.
        if [ "$BUILD" = auto ]; then
          if [ "$RUNNER_OS" = macOS ]; then
            BUILD=prebuild,export,ios
          else
            BUILD=prebuild,export,android
          fi
          echo "build=auto resolved to '$BUILD' on $RUNNER_OS"
        fi

        # Build a comma-delimited plan, `,prebuild,export,`, so the later steps can
        # match whole tokens with `contains(..., ',ios,')`. A substring test on the
        # raw input would also fire for `exports` or `ios-simulator`.
        PLAN=,
        IFS=, read -ra REQUESTED <<< "$BUILD"
        for step in "${REQUESTED[@]}"; do
          step="${step//[[:space:]]/}"
          if [ -z "$step" ]; then
            continue
          fi

          # An unknown step used to be skipped in silence, so a typo produced a green
          # job that built nothing. Reject it instead.
          case "$step" in
            prebuild | export | ios | android) ;;
            *)
              echo "::error::Unknown build step '$step'. Expected a comma-separated list of prebuild, export, ios, android, or the single value auto."
              exit 1
              ;;
          esac

          case "$PLAN" in
            *",$step,"*) ;;
            *) PLAN="$PLAN$step," ;;
          esac
        done

        if [ "$PLAN" = , ]; then
          echo "::error::build resolved to no steps. Expected at least one of prebuild, export, ios, android."
          exit 1
        fi

        # iOS needs Xcode, so it cannot run anywhere but macOS. Fail here rather
        # than skipping the build later and reporting success for work that never
        # happened. Checked up front so the run ends in seconds, not after a
        # prebuild.
        case "$PLAN" in
          *,ios,*)
            if [ "$RUNNER_OS" != macOS ]; then
              echo "::error::build includes 'ios' but this runner is $RUNNER_OS. iOS builds need a macOS runner."
              exit 1
            fi
            ;;
        esac

        echo "Build plan: ${PLAN//,/ }"
        echo "steps=$PLAN" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Resolve Expo version
      id: resolve-version
      uses: $/resolve-expo-versions
      with:
        expo-version: ${{ inputs.expo-version }}
        single: 'true'

    - name: Setup Expo app
      id: setup-app
      env:
        APP_PATH: ${{ inputs.app-path }}
        APP_TEMPLATE: ${{ inputs.app-template }}
        TEMPLATE_TAG: ${{ steps.resolve-version.outputs.template-tag }}
        RESOLVED_VERSION: ${{ steps.resolve-version.outputs.resolved-version }}
      run: |
        echo "::group::Setup Expo app"
        echo "app-name=$(basename "$APP_PATH")" >> "$GITHUB_OUTPUT"
        if [ -d "$APP_PATH" ]; then
          echo "Using existing app at $APP_PATH"
          cd "$APP_PATH"
          npx expo install "expo@$RESOLVED_VERSION" --fix
        else
          echo "Creating new Expo app at $APP_PATH"
          npx create-expo-app "$APP_PATH" --yes --template "$APP_TEMPLATE@$TEMPLATE_TAG"
          cd "$APP_PATH"
          npx expo install "expo@$RESOLVED_VERSION" --fix
          npx expo customize metro.config.js
        fi
        echo "::endgroup::"
      shell: bash

    - name: Install local package
      if: inputs.local-package != ''
      env:
        LOCAL_PACKAGE: ${{ inputs.local-package }}
      run: |
        echo "::group::Install local package"
        case "$LOCAL_PACKAGE" in
          /*) SOURCE="$LOCAL_PACKAGE" ;;
          *) SOURCE="$GITHUB_WORKSPACE/$LOCAL_PACKAGE" ;;
        esac

        if [ -d "$SOURCE" ]; then
          echo "Packing $SOURCE"
          PACK_DIR=$(mktemp -d)
          # npm pack honours the `files` field and runs the `prepare` script.
          # Output goes to stderr so lifecycle noise cannot be mistaken for the path.
          (cd "$SOURCE" && npm pack --pack-destination "$PACK_DIR" >&2)
          TARBALL=$(find "$PACK_DIR" -name '*.tgz' -maxdepth 1 | head -n1)
          if [ -z "$TARBALL" ]; then
            echo "npm pack produced no tarball in $SOURCE" >&2
            exit 1
          fi
        elif [ -f "$SOURCE" ]; then
          TARBALL="$SOURCE"
        else
          echo "local-package not found: $SOURCE" >&2
          exit 1
        fi

        # `app-path` can point at an existing app in the caller's repo, and those
        # rarely use npm. Running `npm install` inside a Yarn Berry project drops a
        # package-lock.json next to yarn.lock and can break PnP resolution outright.
        if [ -f yarn.lock ]; then
          INSTALL="yarn add"
        elif [ -f pnpm-lock.yaml ]; then
          INSTALL="pnpm add"
        elif [ -f bun.lock ] || [ -f bun.lockb ]; then
          INSTALL="bun add"
        else
          INSTALL="npm install"
        fi

        echo "Installing $TARBALL with $INSTALL"
        $INSTALL "$TARBALL"
        echo "EXPO_LOCAL_PACKAGE_TARBALL=$TARBALL" >> "$GITHUB_ENV"
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Copy test files into the app
      if: inputs.copy-files != ''
      env:
        COPY_FILES: ${{ inputs.copy-files }}
      run: |
        echo "::group::Copy test files into the app"
        case "$COPY_FILES" in
          /*) SOURCE="$COPY_FILES" ;;
          *) SOURCE="$GITHUB_WORKSPACE/$COPY_FILES" ;;
        esac

        if [ -d "$SOURCE" ]; then
          cp -Rv "$SOURCE/." .
        elif [ -f "$SOURCE" ]; then
          cp -v "$SOURCE" .
        else
          echo "copy-files not found: $SOURCE" >&2
          exit 1
        fi
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Register config plugins
      if: inputs.config-plugins != ''
      env:
        CONFIG_PLUGINS: ${{ inputs.config-plugins }}
      run: |
        echo "::group::Register config plugins"
        node <<'NODE'
        const fs = require('node:fs');

        const shape = 'a JSON array, for example ["expo-router"] or [["my-plugin", { "mode": "dark" }]]';

        let plugins;
        try {
          plugins = JSON.parse(process.env.CONFIG_PLUGINS);
        } catch (error) {
          console.error(`config-plugins is not valid JSON: ${error.message}`);
          console.error(`Expected ${shape}`);
          process.exit(1);
        }

        if (!Array.isArray(plugins)) {
          console.error(`config-plugins must be ${shape}`);
          process.exit(1);
        }

        if (!fs.existsSync('app.json')) {
          console.error('app.json not found. config-plugins only supports static app.json config.');
          console.error('For app.config.js or app.config.ts, edit the plugins list from setup-hook instead.');
          process.exit(1);
        }

        // A plugin is either "name" or ["name", options]. Match on the name so a
        // second entry for the same plugin replaces the first instead of duplicating it.
        const nameOf = (plugin) => (Array.isArray(plugin) ? plugin[0] : plugin);

        const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
        config.expo ??= {};
        config.expo.plugins ??= [];

        for (const plugin of plugins) {
          const index = config.expo.plugins.findIndex((entry) => nameOf(entry) === nameOf(plugin));
          if (index === -1) {
            config.expo.plugins.push(plugin);
          } else {
            config.expo.plugins[index] = plugin;
          }
        }

        fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
        console.log(`app.json plugins: ${JSON.stringify(config.expo.plugins)}`);
        NODE
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Run setup hook
      if: inputs.setup-hook != ''
      run: |
        echo "::group::Run setup hook"
        ${{ inputs.setup-hook }}
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Run expo prebuild
      if: contains(steps.build-plan.outputs.steps, ',prebuild,')
      run: |
        echo "::group::Run expo prebuild"
        npx expo prebuild
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        # Build against prebuilt React Native core rather than compiling it from
        # source. It cuts several minutes off `pod install`, at the cost of not
        # catching breakage that only shows up in a source build of RN. Ignored by
        # SDKs that predate the prebuilt artifacts.
        RCT_USE_PREBUILT_RNCORE: 1
        RCT_USE_RN_DEP: 1
        EXPO_DEBUG: 0

    - name: Bundle JS code
      if: contains(steps.build-plan.outputs.steps, ',export,')
      run: |
        echo "::group::Bundle JS code"
        npx expo export
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Build iOS
      if: contains(steps.build-plan.outputs.steps, ',ios,')
      env:
        IOS_SCHEME: ${{ inputs.ios-scheme }}
      run: |
        echo "::group::Build iOS"
        SCHEME="$IOS_SCHEME"
        if [ -z "$SCHEME" ]; then
          SCHEME=$(basename "$(ls -d ios/*.xcworkspace | head -n1)" .xcworkspace)
        fi
        echo "Building iOS app (scheme: $SCHEME)"
        xcodebuild \
          -workspace "ios/${SCHEME}.xcworkspace" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphonesimulator \
          -derivedDataPath ios/build
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Build Android
      if: contains(steps.build-plan.outputs.steps, ',android,')
      env:
        ANDROID_GRADLE_TASK: ${{ inputs.android-gradle-task }}
      run: |
        echo "::group::Build Android"
        echo "Building Android app (task: $ANDROID_GRADLE_TASK)"
        cd android
        ./gradlew "$ANDROID_GRADLE_TASK"
        echo "::endgroup::"
      shell: bash
      working-directory: ${{ inputs.app-path }}

    - name: Upload app
      if: always() && inputs.upload-app == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('expo-app-{0}-{1}-sdk{2}', runner.os, steps.setup-app.outputs.app-name, steps.resolve-version.outputs.resolved-version) }}
        path: |
          ${{ inputs.app-path }}
          !${{ inputs.app-path }}/node_modules
          !${{ inputs.app-path }}/ios/build
          !${{ inputs.app-path }}/ios/Pods
          !${{ inputs.app-path }}/android/.gradle
          !${{ inputs.app-path }}/android/app/build/intermediates
        retention-days: 7

inputs:
  expo-version:
    description: 'Expo SDK version: numeric (52), latest, latest-N (latest-1, latest-2), next, or canary'
    required: true
  app-path:
    description: Path where app exists or will be created (also used as project name for create-expo-app)
    default: expo-test-app
  app-template:
    description: Template for new apps
    default: expo-template-blank-typescript
  local-package:
    description: >-
      Path to the library under test, relative to the workspace root or absolute.
      A directory is packed with `npm pack` first; a `.tgz` file is installed as is.
      Dependencies must already be installed in a directory, so `npm pack` can run
      the `prepare` script. Runs before `setup-hook`, which receives the resolved
      tarball path in `$EXPO_LOCAL_PACKAGE_TARBALL`.
    required: false
  copy-files:
    description: >-
      Path to a file or directory copied into the app root, relative to the
      workspace root or absolute. Existing files are overwritten. Use it to drop
      in an `App.tsx` that exercises the library, so `expo export` fails when the
      JS entry point breaks. Runs after `local-package` and before `setup-hook`.
    required: false
  config-plugins:
    description: >-
      Config plugins to add to `expo.plugins` in `app.json`, as a JSON array.
      An entry is either a plugin name, or a `[name, options]` pair when the
      plugin takes parameters. An entry replaces an existing one with the same
      name. Runs after `copy-files` and before `setup-hook`.
    required: false
  setup-hook:
    description: Script to run after app is created/updated (install package, modify App.tsx, app.json, etc)
    required: false
  build:
    description: >-
      Comma-separated list of steps to run: `prebuild`, `export`, `ios`, `android`.
      The default, `auto`, expands to `prebuild,export,ios` on a macOS runner and
      `prebuild,export,android` everywhere else, so it works on any runner without
      a per-workflow ternary. An unrecognised step is an error, not a skipped step.
    default: auto
  ios-scheme:
    description: iOS scheme name (auto-detected from the generated Xcode workspace if not provided)
    required: false
  android-gradle-task:
    description: Gradle task for Android build
    default: assembleRelease
  upload-app:
    description: Upload the app directory as an artifact for debugging (runs even on failure)
    default: 'false'

outputs:
  resolved-expo-version:
    description: The resolved Expo SDK version (numeric major, 'next', or 'canary')
    value: ${{ steps.resolve-version.outputs.resolved-version }}
