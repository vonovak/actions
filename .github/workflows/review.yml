name: review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v6

      - name: 🏗 Setup project
        uses: ./.github/actions/setup-project
        with:
          bun-version: 1.3.0

      - name: 📦 Install dependencies
        run: bun install

      - name: ✅ Lint code
        run: bun run lint --max-warnings=0

      - name: 🧪 Test code
        run: bun run test

      - name: 🏗 Build actions
        run: bun run build

      - name: ✅ Verify committed build output is current
        run: |
          if [ -n "$(git status --porcelain -- build)" ]; then
            echo "::error::build/ is out of date. Run 'bun run build' and commit the result."
            git status --porcelain -- build
            exit 1
          fi
